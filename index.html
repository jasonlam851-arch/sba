<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad 專屬 K歌點歌系統</title>
    <style>
        /* 基礎重置與 iPad 適配 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 藍牙鎖定畫面 */
        #bt-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #bt-overlay h1 { font-size: 36px; margin-bottom: 20px; color: #ff4757; }
        #bt-overlay p { font-size: 20px; margin-bottom: 40px; color: #cccccc; }
        .btn-large {
            background: #ff4757; color: white; border: none; border-radius: 50px;
            padding: 20px 60px; font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3); transition: transform 0.2s;
        }
        .btn-large:active { transform: scale(0.95); }

        /* 主畫面佈局 */
        #main-app { display: none; flex-direction: column; height: 100%; padding: 20px; }
        
        /* 頂部控制列 */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: #ff4757; }
        .bt-status { font-size: 18px; color: #2ed573; display: flex; align-items: center; gap: 8px; }
        .bt-status::before { content: ''; width: 12px; height: 12px; background: #2ed573; border-radius: 50%; display: inline-block; }

        /* 點歌區塊 */
        .input-section { display: flex; gap: 15px; margin-bottom: 20px; }
        .input-section input {
            flex: 1; padding: 20px; border-radius: 15px; border: 2px solid #333;
            background: #222; color: white; font-size: 20px; outline: none; transition: border-color 0.3s;
        }
        .input-section input:focus { border-color: #ff4757; }
        .input-section button {
            background: #1e90ff; color: white; border: none; border-radius: 15px;
            padding: 0 40px; font-size: 22px; font-weight: bold; cursor: pointer;
        }
        .input-section button:active { background: #0073e6; }

        /* 播放器容器 */
        .player-container { flex: 1; background: #000; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #youtube-player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* 無影片時的佔位圖 */
        .empty-state {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #1a1a1a; z-index: 10; color: #555; pointer-events: none;
        }
        .empty-state h2 { font-size: 32px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 藍牙檢查鎖定畫面 -->
    <div id="bt-overlay">
        <h1>藍牙未連接</h1>
        <p>為確保最佳 K歌體驗，系統要求先連接藍牙音響設備。</p>
        <button class="btn-large" id="connect-bt-btn">連接藍牙設備</button>
        <p id="bt-error" style="color: #ff4757; margin-top: 20px; font-size: 16px;"></p>
    </div>

    <!-- 主應用程式畫面 -->
    <div id="main-app">
        <header>
            <div class="logo">🎤 歡唱 KTV</div>
            <div class="bt-status">已連接藍牙設備</div>
        </header>

        <div class="input-section">
            <input type="text" id="yt-link" placeholder="請在此貼上 YouTube 影片連結..." autocomplete="off">
            <button id="play-btn">立即播放</button>
        </div>

        <div class="player-container">
            <div class="empty-state" id="empty-state">
                <h2>等待點歌中...</h2>
                <p>輸入 YouTube 連結即可開始歡唱</p>
            </div>
            <div id="youtube-player"></div>
        </div>
    </div>

    <!-- 引入 YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // === YouTube 播放器設定 ===
        let ytPlayer;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
        }

        // 解析 YouTube 網址以獲取 Video ID
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 點歌邏輯
        document.getElementById('play-btn').addEventListener('click', () => {
            const urlInput = document.getElementById('yt-link').value.trim();
            const videoId = extractVideoID(urlInput);

            if (videoId) {
                document.getElementById('empty-state').style.display = 'none';
                if (isPlayerReady) {
                    ytPlayer.loadVideoById(videoId);
                } else {
                    alert("播放器尚未準備好，請稍後再試。");
                }
                document.getElementById('yt-link').value = ''; // 清空輸入框
            } else {
                alert("無效的 YouTube 連結，請重新確認！");
            }
        });

        // === 藍牙連接檢查邏輯 (Web Bluetooth API) ===
        const btConnectBtn = document.getElementById('connect-bt-btn');
        const btOverlay = document.getElementById('bt-overlay');
        const mainApp = document.getElementById('main-app');
        const btError = document.getElementById('bt-error');

        btConnectBtn.addEventListener('click', async () => {
            // 檢查瀏覽器是否支援 Web Bluetooth API
            if (!navigator.bluetooth) {
                btError.innerHTML = "您的瀏覽器不支援網頁藍牙 API。<br>iPad 用戶請使用支援 BLE 的瀏覽器 (如 Bluefy)，<br>或直接在系統設定連接藍牙並 <a href='#' onclick='bypassBluetooth()' style='color:#1e90ff'>點此強制進入系統</a>。";
                return;
            }

            try {
                // 請求連接藍牙設備 (接受所有設備，主要用於檢查連接意圖)
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });

                // 連接成功，解鎖介面
                unlockApp();
                
                // 監聽藍牙斷開事件
                device.addEventListener('gattserverdisconnected', () => {
                    alert('藍牙設備已斷開！');
                    lockApp();
                });

            } catch (error) {
                console.error("Bluetooth Connection Error: ", error);
                btError.textContent = "連接失敗或被取消，請再試一次。";
            }
        });

        // 介面切換功能
        function unlockApp() {
            btOverlay.style.display = 'none';
            mainApp.style.display = 'flex';
        }

        function lockApp() {
            btOverlay.style.display = 'flex';
            mainApp.style.display = 'none';
            if(ytPlayer && isPlayerReady) ytPlayer.pauseVideo();
        }

        // 提供給不支援環境的強制進入後門
        function bypassBluetooth() {
            unlockApp();
        }
    </script>
</body>
</html>
