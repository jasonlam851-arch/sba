<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 以適配瀏海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>橫向搖桿貪食蛇</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden; /* 防止滾動 */
            touch-action: none; /* 防止手機瀏覽器滑動與縮放 */
            width: 100vw;
            height: 100vh;
        }

        /* 開始畫面 (用來觸發全螢幕與橫屏鎖定) */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #start-screen h1 {
            margin-bottom: 20px;
            color: #4CAF50;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        /* UI 層：分數與搖桿 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 1px 1px 2px black;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            pointer-events: auto;
        }

        #game-over button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 虛擬搖桿設定 (左下角) */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }

        #joystick-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: 0.1s transform ease-out;
        }
    </style>
</head>
<body>

    <!-- 啟動畫面：必須由玩家點擊才能觸發全螢幕和旋轉 -->
    <div id="start-screen">
        <h1>貪食蛇</h1>
        <p style="margin-bottom: 20px; color: #ccc;">(將自動進入全螢幕橫向模式)</p>
        <button id="start-btn" onclick="startGameInit()">開始遊戲</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score">分數: 0</div>
            
            <div id="game-over">
                <h2>遊戲結束!</h2>
                <p id="final-score">得分: 0</p>
                <button onclick="resetGame()">再玩一次</button>
            </div>

            <!-- 搖桿區域 -->
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverMenu = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');

        let snake = [];
        let food = {};
        let gridSize = 20;
        let cols, rows;
        let dx = 1, dy = 0;
        let nextDx = 1, nextDy = 0;
        let score = 0;
        let gameInterval;
        let isGameOver = false;
        const speed = 110; // 毫秒/步

        // === 全螢幕與強制橫屏邏輯 ===
        async function startGameInit() {
            let elem = document.documentElement;
            
            // 請求全螢幕
            try {
                if (elem.requestFullscreen) {
                    await elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    await elem.webkitRequestFullscreen();
                }
            } catch (err) {
                console.log("全螢幕請求失敗:", err);
            }

            // 鎖定為橫向 (Landscape)
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape");
                }
            } catch (err) {
                console.log("螢幕方向鎖定失敗 (部分iOS瀏覽器不支援):", err);
            }

            // 隱藏開始畫面，初始化畫布並開始遊戲
            startScreen.style.display = 'none';
            setTimeout(() => {
                resizeCanvas(); // 給予一點時間讓螢幕旋轉完成後再計算大小
                resetGame();
            }, 300);
        }

        // 動態適應螢幕大小 (解決不適合問題)
        function resizeCanvas() {
            // 使用 window.innerWidth 保證填滿當前視圖
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / gridSize);
            rows = Math.floor(canvas.height / gridSize);
        }

        // 監聽螢幕旋轉或大小改變事件
        window.addEventListener('resize', () => {
            if (startScreen.style.display === 'none') {
                resizeCanvas();
            }
        });

        // === 遊戲核心邏輯 ===
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows)
            };
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function resetGame() {
            snake = [
                {x: Math.floor(cols/2), y: Math.floor(rows/2)},
                {x: Math.floor(cols/2) - 1, y: Math.floor(rows/2)},
                {x: Math.floor(cols/2) - 2, y: Math.floor(rows/2)}
            ];
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;
            score = 0;
            scoreElement.innerText = "分數: " + score;
            isGameOver = false;
            gameOverMenu.style.display = 'none';
            spawnFood();
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, speed);
        }

        function drawRect(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 1, gridSize - 1);
        }

        function gameLoop() {
            if (isGameOver) return;

            dx = nextDx;
            dy = nextDy;
            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 穿牆機制
            if (head.x < 0) head.x = cols - 1;
            if (head.x >= cols) head.x = 0;
            if (head.y < 0) head.y = rows - 1;
            if (head.y >= rows) head.y = 0;

            for (let part of snake) {
                if (part.x === head.x && part.y === head.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = "分數: " + score;
                spawnFood();
            } else {
                snake.pop();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawRect(food.x, food.y, '#FF3366'); // 食物顏色
            
            snake.forEach((part, index) => {
                let color = index === 0 ? '#4CAF50' : '#81C784';
                drawRect(part.x, part.y, color);
            });
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            finalScoreElement.innerText = "得分: " + score;
            gameOverMenu.style.display = 'block';
        }

        // === 虛擬搖桿邏輯 ===
        const joystickZone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');
        const maxRadius = 35;
        let joystickCenter = {x: 0, y: 0};

        joystickZone.addEventListener('touchstart', handleJoystickStart, {passive: false});
        joystickZone.addEventListener('touchmove', handleJoystickMove, {passive: false});
        joystickZone.addEventListener('touchend', handleJoystickEnd);

        function handleJoystickStart(e) {
            e.preventDefault();
            const rect = document.getElementById('joystick-base').getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width / 2;
            joystickCenter.y = rect.top + rect.height / 2;
            stick.style.transition = 'none';
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            const touch = e.targetTouches[0];
            let deltaX = touch.clientX - joystickCenter.x;
            let deltaY = touch.clientY - joystickCenter.y;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 10 && dx !== -1) { nextDx = 1; nextDy = 0; }
                else if (deltaX < -10 && dx !== 1) { nextDx = -1; nextDy = 0; }
            } else {
                if (deltaY > 10 && dy !== -1) { nextDx = 0; nextDy = 1; }
                else if (deltaY < -10 && dy !== 1) { nextDx = 0; nextDy = -1; }
            }
        }

        function handleJoystickEnd(e) {
            stick.style.transition = '0.1s transform ease-out';
            stick.style.transform = `translate(-50%, -50%)`;
        }

    </script>
</body>
</html>
